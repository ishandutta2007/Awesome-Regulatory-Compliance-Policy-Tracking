<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .badge-hdr {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 20px;
      fill: #f8fafc;
    }
    .stat-lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }

    /* CSS Animations for Dynamic Elements */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -20px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes pulseOrb2 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.22) translate(-30px, 15px); opacity: 0.55; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); transform-origin: 1040px 180px; }
      100% { transform: rotate(360deg); transform-origin: 1040px 180px; }
    }
    @keyframes pulseRing {
      0% { r: 40px; opacity: 0.8; }
      50% { r: 75px; opacity: 0.2; }
      100% { r: 40px; opacity: 0.8; }
    }

    .orb-1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 12s ease-in-out infinite; transform-origin: 1000px 300px; }
    .pill-anim-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPill2 6.5s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 6; animation: dashStream 3s linear infinite; }
    .radar-sweep { animation: radarSpin 8s linear infinite; }
    .pulse-circle { animation: pulseRing 4s ease-in-out infinite; }
  </style>

  <!-- Deep Mesh Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
  </g>

  <!-- Background Dynamic Ambient Orbs -->
  <g>
    <circle class="orb-1" cx="220" cy="110" r="160" fill="#0284c7" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="280" r="190" fill="#6366f1" filter="url(#glow)" />
    <circle cx="600" cy="380" r="140" fill="#a855f7" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Animated Radar / Governance Scanner Visual (Right Anchor) -->
  <g opacity="0.85">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle class="pulse-circle" cx="1040" cy="180" r="45" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <circle cx="1040" cy="180" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    
    <!-- Rotating Sweep Beam -->
    <g class="radar-sweep">
      <line x1="1040" y1="180" x2="1150" y2="180" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.8" />
      <polygon points="1040,180 1150,140 1150,180" fill="url(#accentGrad)" opacity="0.12" />
    </g>

    <!-- Radar Target Nodes -->
    <circle cx="985" cy="140" r="4.5" fill="#34d399" filter="url(#softGlow)" />
    <circle cx="1090" cy="225" r="4" fill="#818cf8" filter="url(#softGlow)" />
    <circle cx="1065" cy="115" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Connecting Animated Data Streams -->
  <path class="stream-line" d="M 80 180 Q 520 120 930 180" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" />
  <path class="stream-line" d="M 120 220 Q 500 300 950 200" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3" />

  <!-- Dynamic Foreground Badge Header -->
  <g transform="translate(80, 52)">
    <rect width="275" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="15" r="5" fill="#22c55e" filter="url(#softGlow)" />
    <text x="32" y="20" class="badge-hdr">ENTERPRISE GRC &amp; REGTECH</text>
  </g>

  <!-- Main Hero Title & Subtitle (Crisp Foreground, No Element Obscuring) -->
  <!-- Gradient Bar Accent -->
  <rect x="80" y="98" width="6" height="52" rx="3" fill="url(#accentGrad)" />
  <text x="98" y="140" class="title-text">Awesome Regulatory Compliance</text>
  <text x="80" y="180" class="title-text" fill="url(#accentGrad)">&amp; Policy Tracking</text>
  <text x="80" y="218" class="subtitle-text">Curated platforms, policy-as-code engines &amp; open-source GRC frameworks</text>

  <!-- Dynamic Pill Badges / Cards (Subtle Floating Animation) -->
  <g class="pill-anim-1" transform="translate(80, 248)">
    <!-- Pill 1: Policy as Code -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="21" r="7" fill="#0284c7" />
      <path d="M19 21 L21 23 L25 19" stroke="#ffffff" stroke-width="1.8" fill="none" />
      <text x="38" y="26" class="tag-text">Policy as Code</text>
    </g>

    <!-- Pill 2: Continuous Audit -->
    <g transform="translate(194, 0)">
      <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="21" r="7" fill="#6366f1" />
      <path d="M19 21 L21 23 L25 19" stroke="#ffffff" stroke-width="1.8" fill="none" />
      <text x="38" y="26" class="tag-text">Continuous Audit</text>
    </g>

    <!-- Pill 3: ISO / SOC 2 / NIST -->
    <g transform="translate(388, 0)">
      <rect width="200" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="21" r="7" fill="#a855f7" />
      <path d="M19 21 L21 23 L25 19" stroke="#ffffff" stroke-width="1.8" fill="none" />
      <text x="38" y="26" class="tag-text">SOC 2 • ISO • HIPAA</text>
    </g>
  </g>

  <!-- Second Row Dynamic Interactive Cards -->
  <g class="pill-anim-2" transform="translate(80, 312)">
    <!-- Metric Card 1: SaaS Scale -->
    <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <text x="20" y="38" class="stat-num">$45B+ ↗</text>
    <text x="20" y="60" class="stat-lbl">Global GRC Market Size</text>
    <circle cx="185" cy="36" r="10" fill="#0369a1" opacity="0.3" />
    <path d="M182 36 L188 36 M185 33 L188 36 L185 39" stroke="#38bdf8" stroke-width="1.8" fill="none" />

    <!-- Metric Card 2: Framework Ecosystem -->
    <g transform="translate(225, 0)">
      <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="20" y="38" class="stat-num">250+ Standards</text>
      <text x="20" y="60" class="stat-lbl">Automated Control Mapping</text>
      <circle cx="185" cy="36" r="10" fill="#4f46e5" opacity="0.3" />
      <path d="M182 36 L188 36 M185 33 L188 36 L185 39" stroke="#818cf8" stroke-width="1.8" fill="none" />
    </g>

    <!-- Metric Card 3: Open Source & Self Hosted -->
    <g transform="translate(450, 0)">
      <rect width="220" height="74" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="20" y="38" class="stat-num">100% Free &amp; FOSS</text>
      <text x="20" y="60" class="stat-lbl">Self-Hosted Community Tools</text>
      <circle cx="195" cy="36" r="10" fill="#059669" opacity="0.3" />
      <path d="M192 36 L198 36 M195 33 L198 36 L195 39" stroke="#34d399" stroke-width="1.8" fill="none" />
    </g>
  </g>

  <!-- Modern Glowing Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />
</svg>
